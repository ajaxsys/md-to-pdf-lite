name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [24]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Chrome and CJK fonts on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable fonts-noto-cjk

      - name: Install dependencies
        run: npm ci

      - name: Run unit & automated PDF tests
        run: npm test

      - name: Run cross-platform CLI E2E tests
        run: node test/e2e-cli.test.js

      - name: Build Web Studio for E2E
        if: runner.os == 'Linux'
        run: |
          cd web
          npm ci
          npm run build
          cd ..

      - name: Run Web Studio E2E tests
        if: runner.os == 'Linux'
        run: node test/e2e-web.test.js
