name: Build and Attach PDFs on Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Google Chrome (Headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable fonts-noto-cjk
          
      - name: Install md-to-pdf-lite
        run: npm install -g .
        
      - name: Batch Convert Markdown Documents
        run: |
          mkdir -p output-pdfs
          md2pdf-lite "docs/*.md" "examples/*.md" -o output-pdfs/
          
      - name: Upload PDF Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-pdfs
          path: output-pdfs/*.pdf
